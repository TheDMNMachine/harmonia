name: Build, Push Docker Image and Deploy to VPS

on:
  push:
    branches:
      - main  # Triggers on push to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Log in to GitHub Container Registry
      run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build Docker image
      run: docker build -t ghcr.io/thedmnmachine/harmonia:latest .

    - name: Push Docker image
      run: docker push ghcr.io/thedmnmachine/harmonia:latest

    - name: Install SSH client
      run: sudo apt-get update && sudo apt-get install -y sshpass

    - name: Deploy to VPS
      env:
        VPS_HOST_ADDRESS: ${{ secrets.VPS_HOST_ADDRESS }}
        VPS_HOST_PASSWORD: ${{ secrets.VPS_HOST_PASSWORD }}
        VPS_HOST_PORT: ${{ secrets.VPS_HOST_PORT }}
      run: |
        sshpass -p "${{ secrets.VPS_HOST_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.VPS_HOST_PORT }} root@${{ secrets.VPS_HOST_ADDRESS }} << 'EOF'
          # Pull the latest Docker image
          docker pull ghcr.io/thedmnmachine/harmonia:latest

          # Stop and remove the currently running container if it exists
          if [ "$(docker ps -a -q -f name=harmonia-app)" ]; then
            docker rm -f harmonia-app
          fi

          # Run the new Docker container on a different external port (e.g., 3001)
          docker run -d --name harmonia-app -p 3001:80 ghcr.io/thedmnmachine/harmonia:latest
          
          # Reload Nginx to apply changes
          nginx -s reload
        EOF
